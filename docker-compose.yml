# Local stack for Cards IT Assessment
# Requirement: MSSQL on local machine, DB name = TESTDB
#
# Usage:
#   docker compose up -d mssql          # DB only (run Spring Boot on host)
#   docker compose up -d --build        # DB + Spring Boot app together

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cards-it-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./docker/mssql/init-testdb.sh:/docker-init/init-testdb.sh:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - cards-net

  # One-shot job: create TESTDB after MSSQL is healthy
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cards-it-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql/init-testdb.sh:/init-testdb.sh:ro
      - ./sql/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/bash", "/init-testdb.sh"]
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_HOST: mssql
    networks:
      - cards-net
    restart: "no"

  # Optional: run the Spring Boot app inside Docker too
  app:
    build: .
    container_name: cards-it-app
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://mssql:1433;databaseName=TESTDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: YourStrong@Passw0rd
    volumes:
      - ./logs:/app/logs
    networks:
      - cards-net
    profiles:
      - full

volumes:
  mssql_data:

networks:
  cards-net:
    driver: bridge
